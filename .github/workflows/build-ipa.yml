name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          ls -la

      - name: 编译（未签名）
        id: build
        continue-on-error: true
        run: |
          xcodebuild \
            -project BiliTranslate.xcodeproj \
            -scheme BiliTranslate \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build > build.log 2>&1 || true
          echo "=== error 行 ==="
          grep -n -i "error:" build.log | head -30 || echo "(无 error)"
          echo "=== extension 相关构建步骤 ==="
          grep -n -E "BiliTranslateExtension|ProcessInfoPlistFile" build.log | head -40 || true

      - name: 检查产物
        if: always()
        run: |
          echo "=== Products ==="
          find build/Build/Products/Release-iphoneos -maxdepth 3 | head -60 || true
          APPEX=$(find build/Build/Products/Release-iphoneos -name '*.appex' | head -1)
          echo "APPEX=$APPEX"
          if [ -n "$APPEX" ]; then
            ls -la "$APPEX"
            echo "--- appex Info.plist ---"
            plutil -p "$APPEX/Info.plist" 2>&1 | head -30 || echo "(无法读取)"
            echo "--- appex/Resources ---"
            ls -la "$APPEX/Resources" 2>&1 | head -20 || echo "(无 Resources 目录)"
          fi

      - name: 校验编译结果
        if: steps.build.outcome != 'success'
        run: |
          echo "编译失败，见上面日志"
          exit 1

      - name: 打包 IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP" || { echo "没找到 .app"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry BiliTranslate.ipa Payload
          ls -lh BiliTranslate.ipa
          echo "--- IPA 目录结构 ---"
          unzip -l BiliTranslate.ipa | head -40

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BiliTranslate-ipa
          path: out/BiliTranslate.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/BiliTranslate.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
