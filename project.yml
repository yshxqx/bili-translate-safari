name: BiliTranslate

options:
  bundleIdPrefix: com.yshxqx
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
    # CI 里编译未签名的包，签名交给用户本地的签名工具
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

targets:
  BiliTranslate:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 划词翻译
        CFBundleName: BiliTranslate
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yshxqx.bilitranslate
        PRODUCT_NAME: BiliTranslate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: BiliTranslateExtension
        embed: true

  BiliTranslateExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      # folder reference：整个目录原样复制进 .appex/Resources/
      - path: Shared/Resources
        type: folder
        buildPhase: resources
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: 划词翻译
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yshxqx.bilitranslate.Extension
        PRODUCT_NAME: BiliTranslateExtension
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
    dependencies:
      - sdk: SafariServices.framework

schemes:
  BiliTranslate:
    build:
      targets:
        BiliTranslate: all
    run:
      config: Debug
    archive:
      config: Release
